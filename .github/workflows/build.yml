name: Build UNO Q Zephyr Loader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity & Tag for Build Script
        run: |
          git config --global user.email "ci@arduino-custom.local"
          git config --global user.name "CI Runner"
          git config --global --add safe.directory /home/runner/work/ArduinoCore-zephyr/ArduinoCore-zephyr
          git tag -f 0.90.0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 1: Attempt to restore from cache
      - name: Restore Zephyr SDK & Workspace Cache
        id: restore-zephyr-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/zephyr-sdk-0.16.8
            ~/zephyr-sdk-0.16.8
            ~/zephyr_env
            ../zephyr
            ../modules
            ../bootloader
            ../tools
          key: zephyr-full-workspace-v5

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git cmake ninja-build \
                              zstd jq rsync wget libglib2.0-0

      - name: Setup Virtualenv & Dependencies
        run: |
          if [ ! -d "$HOME/zephyr_env" ]; then
            python3 -m venv ~/zephyr_env
          fi
          source ~/zephyr_env/bin/activate
          pip install --upgrade pip
          pip install west requests

      - name: Bootstrap Zephyr Environment
        shell: bash
        run: |
          source ~/zephyr_env/bin/activate
          chmod +x ./extra/bootstrap.sh
          
          # Only bootstrap if zephyr source is missing
          if [ ! -d "../zephyr" ]; then
            yes y | ./extra/bootstrap.sh || true
          fi

      # Step 2: GUARANTEED SAVE (runs even if later steps fail or get canceled)
      - name: Always Save Zephyr Cache
        uses: actions/cache/save@v4
        if: always() && steps.restore-zephyr-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.local/share/zephyr-sdk-0.16.8
            ~/zephyr-sdk-0.16.8
            ~/zephyr_env
            ../zephyr
            ../modules
            ../bootloader
            ../tools
          key: zephyr-full-workspace-v5

      - name: Build Arduino UNO Q Custom Loader
        shell: bash
        run: |
          source ~/zephyr_env/bin/activate
          
          # Locate Zephyr SDK
          if [ -d "$HOME/zephyr-sdk-0.16.8" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-0.16.8"
          elif [ -d "$HOME/.local/share/zephyr-sdk-0.16.8" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/.local/share/zephyr-sdk-0.16.8"
          fi
          
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          chmod +x ./extra/build.sh
          ./extra/build.sh arduino_uno_q

      - name: Upload Firmware and Variant Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unoq-i2s-firmware
          path: |
            firmware/zephyr-arduino_uno_q_stm32u585xx.elf
            firmware/zephyr-arduino_uno_q_stm32u585xx.bin
            variants/arduino_uno_q_stm32u585xx/syms-dynamic.ld
            variants/arduino_uno_q_stm32u585xx/syms-static.ld
          if-no-files-found: warn
