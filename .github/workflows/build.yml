name: Build UNO Q Zephyr Loader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity & Tag
        run: |
          git config --global user.email "ci@arduino-custom.local"
          git config --global user.name "CI Runner"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f 0.90.0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Build Workspace Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.local/share/zephyr-sdk-0.16.8
            /home/runner/zephyr-sdk-1.0.1
            /home/runner/zephyr_env
            /home/runner/work/ArduinoCore-zephyr/zephyr
            /home/runner/work/ArduinoCore-zephyr/modules
          key: zephyr-unoq-workspace-cache-v1

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git cmake ninja-build \
                              zstd jq rsync wget libglib2.0-0

      - name: Setup Virtualenv
        run: |
          if [ ! -d "$HOME/zephyr_env" ]; then
            python3 -m venv ~/zephyr_env
          fi
          source ~/zephyr_env/bin/activate
          pip install --upgrade pip
          pip install west requests

      - name: Bootstrap Environment
        shell: bash
        run: |
          source ~/zephyr_env/bin/activate
          chmod +x ./extra/bootstrap.sh
          if [ ! -d "/home/runner/work/ArduinoCore-zephyr/zephyr" ]; then
            yes y | ./extra/bootstrap.sh || true
          fi

      - name: Save Workspace Cache
        uses: actions/cache/save@v4
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /home/runner/.local/share/zephyr-sdk-0.16.8
            /home/runner/zephyr-sdk-1.0.1
            /home/runner/zephyr_env
            /home/runner/work/ArduinoCore-zephyr/zephyr
            /home/runner/work/ArduinoCore-zephyr/modules
          key: zephyr-unoq-workspace-cache-v1

      - name: Compile UNO Q Loader
        shell: bash
        run: |
          source ~/zephyr_env/bin/activate
          
          if [ -d "$HOME/zephyr-sdk-1.0.1" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-1.0.1"
          elif [ -d "$HOME/.local/share/zephyr-sdk-0.16.8" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/.local/share/zephyr-sdk-0.16.8"
          fi
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          chmod +x ./extra/build.sh
          ./extra/build.sh arduino_uno_q

      - name: Upload UNO Q Firmware & Linker Symbols
        uses: actions/upload-artifact@v4
        with:
          name: unoq-i2s-firmware
          path: |
            firmware/zephyr-arduino_uno_q_stm32u585xx.elf
            firmware/zephyr-arduino_uno_q_stm32u585xx.bin
            variants/arduino_uno_q_stm32u585xx/syms-dynamic.ld
            variants/arduino_uno_q_stm32u585xx/syms-static.ld
          if-no-files-found: warn
