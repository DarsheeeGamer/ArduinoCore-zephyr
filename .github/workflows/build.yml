name: Build UNO Q Zephyr Loader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Git Identity & Tag
        run: |
          git config --global user.email "ci@arduino-custom.local"
          git config --global user.name "CI Runner"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f 0.90.0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Build Workspace Cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.local/share/zephyr-sdk-0.16.8
            /home/runner/zephyr-sdk-1.0.1
            /home/runner/work/ArduinoCore-zephyr/zephyr
            /home/runner/work/ArduinoCore-zephyr/modules
            /home/runner/work/ArduinoCore-zephyr/.west
          # BUG FIX (2026-08-21): bumped v2 -> v3. Every cache ever saved
          # under the v2 key was written BEFORE .west/ was added to the
          # save path list above -- so even with today's fix, the very
          # next run would still hit v2, restore a .west-less workspace
          # (identical to the failure this fixes), and "Save Workspace
          # Cache" wouldn't re-save over it (it's gated on cache-hit !=
          # 'true', and a v2 hit is still a hit). Bumping the key forces a
          # real cache miss once, so this run does a full bootstrap
          # (creating .west/ for real) and saves a v3 cache that actually
          # contains it -- every run after this one gets a correct restore.
          key: zephyr-unoq-workspace-cache-v3

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git cmake ninja-build \
                              zstd jq rsync wget libglib2.0-0

      - name: Create Repo Venv & Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install west requests

      - name: Bootstrap Environment
        shell: bash
        run: |
          source venv/bin/activate
          chmod +x ./extra/bootstrap.sh
          # BUG FIX (2026-08-21): this used to check only for the `zephyr/`
          # directory's presence -- but the cache (see "Restore Build
          # Workspace Cache" above) restores `zephyr/` and `modules/`
          # without also restoring `.west/`, which is the actual marker
          # `west topdir` (and therefore ./extra/build.sh, which depends on
          # it) needs to recognize this as a real workspace at all.
          # Confirmed live via a real CI run (job 96888659859, run
          # 32519579002): "Restore Build Workspace Cache" reported a clean
          # cache hit and successful restore, "Bootstrap Environment" then
          # saw `zephyr/` already present and skipped bootstrap.sh entirely
          # (including its `west init -l .` call, the only thing that
          # creates `.west/`) -- and "Compile UNO Q Loader" immediately
          # failed with "FATAL ERROR: no west workspace found ... west
          # topdir requires one". A directory tree that looks complete
          # enough to skip re-bootstrapping was actually missing the one
          # file that makes it a workspace -- checking for `.west` instead
          # of `zephyr` is checking for the thing that's actually load-
          # bearing for this decision, not a proxy for it that can drift
          # out of sync with what the cache actually restores.
          if [ ! -d "/home/runner/work/ArduinoCore-zephyr/.west" ]; then
            yes y | ./extra/bootstrap.sh || true
          fi

      - name: Save Workspace Cache
        uses: actions/cache/save@v4
        if: always() && steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: |
            /home/runner/.local/share/zephyr-sdk-0.16.8
            /home/runner/zephyr-sdk-1.0.1
            /home/runner/work/ArduinoCore-zephyr/zephyr
            /home/runner/work/ArduinoCore-zephyr/modules
            /home/runner/work/ArduinoCore-zephyr/.west
          # BUG FIX (2026-08-21): must match the restore key above
          # (zephyr-unoq-workspace-cache-v3), not the old v2. Caught this
          # mismatch before pushing -- restore-cache would correctly miss
          # on v3 (forcing today's real bootstrap), but saving back under
          # v2 would mean every SUBSEQUENT run also misses v3 and re-does
          # the full bootstrap from scratch every time, silently defeating
          # the cache's entire purpose (each run would still produce a
          # correct .west/, just slowly, at full bootstrap cost every run
          # instead of once).
          key: zephyr-unoq-workspace-cache-v3

      - name: Debug Workspace State
        shell: bash
        run: |
          echo "--- pwd ---"; pwd
          echo "--- ls -la \$GITHUB_WORKSPACE parent ---"; ls -la "$(dirname "$GITHUB_WORKSPACE")"
          echo "--- ls -la \$GITHUB_WORKSPACE ---"; ls -la "$GITHUB_WORKSPACE"
          echo "--- find any .west/zephyr/modules dirs under /home/runner/work ---"
          find /home/runner/work -maxdepth 3 \( -name ".west" -o -name "zephyr" -o -name "modules" \) 2>&1
          echo "--- west topdir (run from checkout) ---"
          source venv/bin/activate
          west topdir 2>&1 || echo "west topdir FAILED with exit $?"
          echo "--- raw cmake invocation as get_variant_name.sh would run it ---"
          cmake "-DBOARD=arduino_uno_q" -P extra/get_variant_name.cmake 2>&1 || echo "cmake FAILED with exit $?"

      - name: Compile UNO Q Loader
        shell: bash
        run: |
          source venv/bin/activate

          if [ -d "$HOME/zephyr-sdk-1.0.1" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-1.0.1"
          elif [ -d "$HOME/.local/share/zephyr-sdk-0.16.8" ]; then
            export ZEPHYR_SDK_INSTALL_DIR="$HOME/.local/share/zephyr-sdk-0.16.8"
          fi
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          
          chmod +x ./extra/build.sh
          ./extra/build.sh arduino_uno_q

      - name: Upload UNO Q Firmware & Linker Symbols
        uses: actions/upload-artifact@v4
        with:
          name: unoq-i2s-firmware
          # BUG FIX (2026-08-22): path was singular `firmware/`, but
          # extra/build.sh (see its `for ext in elf bin hex uf2` loop and
          # the `cp .../zephyr.dts firmwares/...` / `.../zephyr.config
          # firmwares/...` lines right after) writes every compiled output
          # to plural `firmwares/`, not `firmware/`. With
          # if-no-files-found: warn, this mismatch would never fail the
          # job -- it would silently upload an artifact containing zero of
          # the actual compiled files, only the two syms .ld paths (which
          # ARE correct, since build.sh writes those into
          # variants/<variant>/ as named here). Caught by actually reading
          # build.sh's output paths line-by-line rather than assuming this
          # step, unchanged since before this session, was already
          # correct. Also added the .dts and .config outputs build.sh
          # produces, since the person asked to confirm exactly what
          # landed in the artifact and those are called out in
          # build.sh's own header comment as expected outputs of this
          # workflow, but weren't being uploaded at all before this fix.
          path: |
            firmwares/zephyr-arduino_uno_q_stm32u585xx.elf
            firmwares/zephyr-arduino_uno_q_stm32u585xx.bin
            firmwares/zephyr-arduino_uno_q_stm32u585xx.dts
            firmwares/zephyr-arduino_uno_q_stm32u585xx.config
            variants/arduino_uno_q_stm32u585xx/syms-dynamic.ld
            variants/arduino_uno_q_stm32u585xx/syms-static.ld
          if-no-files-found: warn
